[package]
name = "margin"
description = "Margin: a reader-first PDF app built on PdfCraft's interface"
# Margin's own release version (tags v<version>, packaging/margin/); the PdfCraft crates it
# builds on keep the workspace version.
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click, Open With and Dock drops arrive as Apple events; PdfCraft's handler
# (apps/pdfcraft/src/apple_events.rs, used as is) needs it. Same pin as apps/pdfcraft.
fmv-macos-events = "=0.1.0"
