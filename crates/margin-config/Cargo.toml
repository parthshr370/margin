[package]
name = "margin-config"
description = "Margin's settings and keymap files: Settings, validation, the keymap compiler and resolver"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-engine = { workspace = true }
serde = { workspace = true }
# No `preserve_order`: features unify across the workspace, and PdfCraft's JSON output must not
# change. Key order is kept where it matters by sorting on file positions instead.
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# KOReader's partialMD5, the sidecar fingerprint (already in the tree through pdfcraft-crypt).
md-5 = "0.11"
# The per-OS config directory (`~/.config/margin` on Linux).
dirs = "7"
# JSONC with byte ranges, for `file:line:col` in problems.
jsonc-parser = { version = "0.34", features = ["cst"] }
# JSON Schema from the Settings struct: the validator walks it and editors complete from it.
schemars = "1"
# Library covers: the first page through the existing renderer (already in the tree via the engine).
pdfcraft-render = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# library.sqlite and stats.sqlite, SQLite compiled in (no system library needed).
rusqlite = { version = "0.40", features = ["bundled"] }
# Decoding cached JPEG covers (already in the tree through the engine).
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
# Generated schemas checked against an independent validator.
jsonschema = { version = "0.58", default-features = false }
