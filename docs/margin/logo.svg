    <path d="M260 245C262 223 264 192 276 163Q280 153 287 162L316 207Q333 202 350 207L378 161Q385 153 390 163C401 190 404 219 403 244C415 262 420 279 416 293L422 302Q416 310 405 313L407 319Q390 333 349 347Q333 352 317 346C294 339 273 327 261 316L252 313Q247 309 244 303L251 295C247 277 251 258 260 245Z" fill="url(#fur)"/>
    <path d="M274 226C274 211 278 189 281 182Q283 179 286 185L307 217C295 217 284 220 274 226Z" fill="url(#ear)"/>
    <path d="M360 217L381 183Q384 179 386 185C391 199 394 214 394 227C383 221 372 218 360 217Z" fill="url(#ear)"/>
    <path d="M277 219C278 207 280 198 282 192L295 214Z" fill="#f4a076" opacity="0.65"/>
    <path d="M372 214L383 193C386 201 388 210 389 219Z" fill="#f4a076" opacity="0.65"/>
    <path d="M253 297C267 297 280 282 297 283C313 284 321 301 334 304C348 301 356 284 371 283C388 282 401 295 416 297L410 305L418 307C405 321 391 326 380 333C362 344 348 349 334 349C316 349 302 342 287 334C273 328 260 321 253 313L260 308Z" fill="#a9361c" opacity="0.38"/>
    <path d="M252 291C265 292 279 277 297 278C312 279 320 298 334 300C348 298 356 279 371 278C387 277 399 291 416 293L410 301L418 303C407 316 393 322 381 329C363 340 348 344 334 344C316 344 303 337 287 329C274 324 260 317 253 309L260 304Z" fill="url(#cream)"/>
    <g fill="none" stroke="#35251e" stroke-width="8" stroke-linecap="round">
      <path d="M280 266C287 255 299 255 306 266"/>
      <path d="M359 266C366 255 378 255 385 266"/>
    </g>
    <path d="M323 303Q334 299 345 303Q350 306 346 311L338 319Q334 323 330 319L322 311Q318 306 323 303Z" fill="#35251e"/>
    <path d="M334 319V324C331 332 323 333 318 329M334 324C337 332 345 333 350 329" fill="none" stroke="#35251e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tapered forelegs grow out of the cheeks and wrap onto the page. -->
    <path d="M291 330C287 338 281 345 283 355C285 365 295 369 306 366C318 364 323 354 320 345L315 337Z" fill="url(#paw)"/>
    <path d="M352 338L347 348C344 358 350 367 362 368C374 370 384 364 384 354C384 344 377 337 375 330Z" fill="url(#paw)"/>
    <g fill="none" stroke="#ad3d21" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M294 357V363M304 358V364M358 359V365M369 358V365"/>
    </g>
  </g>
</svg>
