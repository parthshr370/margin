<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Margin</title>
  <desc id="desc">A happy ember-orange fox nestled around the margin of a cream page, with a curled white-tipped tail and paws resting over the paper.</desc>
  <defs>
    <linearGradient id="paper" x1="100" y1="76" x2="330" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff9ed"/><stop offset="1" stop-color="#e9dfcc"/>
    </linearGradient>
    <linearGradient id="fold" x1="306" y1="78" x2="336" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf6"/><stop offset="1" stop-color="#d8cbb4"/>
    </linearGradient>
    <linearGradient id="fur" x1="290" y1="178" x2="365" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f58b45"/><stop offset="0.52" stop-color="#ec5b2b"/><stop offset="1" stop-color="#ce431e"/>
    </linearGradient>
    <linearGradient id="body" x1="342" y1="298" x2="393" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ec5b2b"/><stop offset="1" stop-color="#ad361c"/>
    </linearGradient>
    <linearGradient id="tail" x1="419" y1="324" x2="393" y2="422" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f58b45"/><stop offset="0.6" stop-color="#ec5b2b"/><stop offset="1" stop-color="#ce431e"/>
    </linearGradient>
    <linearGradient id="cream" x1="324" y1="281" x2="353" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff9ed"/><stop offset="1" stop-color="#f0dfc2"/>
    </linearGradient>
    <linearGradient id="ear" x1="310" y1="184" x2="336" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f3424"/><stop offset="1" stop-color="#d95a34"/>
    </linearGradient>
    <linearGradient id="paw" x1="0" y1="330" x2="0" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f58b45"/><stop offset="1" stop-color="#ec5b2b"/>
    </linearGradient>
    <linearGradient id="cast" x1="263" y1="267" x2="307" y2="328" gradientUnits="userSpaceOnUse">
      <stop stop-color="#704124" stop-opacity="0"/><stop offset="1" stop-color="#704124" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="page-clip">
      <path transform="rotate(-4 220 256)" d="M112 76H304L348 120V408Q348 428 328 428H112Q92 428 92 408V96Q92 76 112 76Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0e0e0e"/>
  <g id="mark">
    <!-- The tail and seated shoulders sit behind the right-hand page edge. -->
    <path d="M355 393C368 375 389 380 406 365C421 352 426 331 422 313C421 306 427 304 432 310C453 333 461 365 450 392C438 424 393 436 365 414C357 408 351 400 355 393Z" fill="url(#tail)"/>
    <path d="M422 313C421 306 427 304 432 310C447 327 455 349 454 369C445 365 438 359 432 351L426 355L423 346C427 335 424 322 422 313Z" fill="url(#cream)"/>
    <path d="M320 303C345 291 377 305 393 329C406 349 413 385 399 405C387 423 356 424 339 405L307 349Z" fill="url(#body)"/>
    <path d="M342 322C356 319 376 329 382 345C387 359 382 374 370 381L348 369Z" fill="url(#cream)"/>
    <g transform="rotate(-4 220 256)">
      <path d="M112 84H304L348 128V416Q348 436 328 436H112Q92 436 92 416V104Q92 84 112 84Z" fill="#000" opacity="0.22"/>
      <path d="M112 76H304L348 120V408Q348 428 328 428H112Q92 428 92 408V96Q92 76 112 76Z" fill="url(#paper)"/>
      <path d="M304 78L348 120H316Q304 120 304 108Z" fill="#ad9774" opacity="0.15" transform="translate(-2 4)"/>
      <path d="M304 76L348 120H316Q304 120 304 108Z" fill="url(#fold)"/>
      <!-- An even reading rhythm; only the highlighted sentence carries colour. -->
      <g fill="#b6ab98">
        <rect x="124" y="128" width="132" height="10" rx="5"/>
        <rect x="124" y="160" width="170" height="10" rx="5"/>
        <rect x="124" y="192" width="145" height="10" rx="5"/>
        <rect x="124" y="256" width="128" height="10" rx="5"/>
        <rect x="124" y="288" width="108" height="10" rx="5"/>
        <rect x="124" y="352" width="122" height="10" rx="5"/>
        <rect x="124" y="384" width="150" height="10" rx="5"/>
      </g>
      <path d="M122 214C164 212 214 215 273 213L270 238C216 237 163 240 120 238Z" fill="#ec5b2b" opacity="0.34"/>
      <path d="M128 225H264" fill="none" stroke="#945132" stroke-width="9" stroke-linecap="round"/>
    </g>
    <!-- Filter-free, page-clipped contact shadow; the mark stays transparent. -->
