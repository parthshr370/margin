      <path d="M275 207C253 228 239 272 249 302C242 312 252 327 276 340C294 351 318 359 338 355L360 354V245Z" fill="url(#cast)" transform="translate(-7 9)"/>
      <path d="M290 337C281 344 279 357 285 367C292 376 311 378 321 370L365 370V340Z" fill="#704124" opacity="0.12"/>
