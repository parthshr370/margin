# Margin's .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which
# stages the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`)
# and exports VERSION, NFPM_ARCH and MARGIN_MAINTAINER. Same layout and dependencies as
# PdfCraft's packaging/linux/nfpm.yaml.
name: margin
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: graphics
priority: optional
maintainer: ${MARGIN_MAINTAINER}
homepage: https://github.com/parthshr370/margin
license: MIT OR Apache-2.0
description: |-
  A calm, reader-first PDF app built on the PdfCraft engine.
  Highlights and notes, a contents sidebar, a library of your books,
  reading statistics and a focus mode.

# The binary links only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/margin
    dst: /usr/bin/margin
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

# PdfCraft's cache refresh (desktop, MIME and icon databases) fits Margin unchanged.
scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
